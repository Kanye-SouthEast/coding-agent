name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      # mypy 作为「建议性」检查：报告但不阻塞流水线，避免初期类型噪声卡住 CI
      - name: mypy (advisory)
        continue-on-error: true
        run: mypy src

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      # 测试强制 mock + subprocess，离线可跑，无需 API key / Docker / Milvus
      - run: python -m pytest

  build:
    name: Build & smoke-test package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      # 装完 wheel 后冒烟跑一次入口，确认 console script 与包结构可用
      - run: coding-agent --help

  # 手动触发：覆盖 pytest 未涉及的 Docker 沙箱路径（mock 默认走 docker 沙箱执行测试）
  docker-smoke:
    name: Docker sandbox smoke (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: docker pull python:3.12-slim
      - name: Run mock demo with docker sandbox
        env:
          CODING_AGENT_SANDBOX: docker
          CODING_AGENT_INTERRUPT_BEFORE_PLAN: "false"
        run: python -m coding_agent.main "fibonacci demo" -y
