global:
  scrape_interval: 15s

scrape_configs:
  # 应用指标：来自 Pushgateway（CLI run 结束后推入）
  # honor_labels 让推入的 language/run_mode/instance 标签优先生效，不被抓取目标覆盖
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]

  # Prometheus 自身
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  # 宿主 / 容器资源指标
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  # Milvus 指标（Milvus 独立容器，已 -p 9091:9091 发布到宿主）
  # Windows Docker Desktop 用 host.docker.internal 直达宿主；Linux 需在 compose 里给
  # prometheus 加 extra_hosts: ["host.docker.internal:host-gateway"]
  - job_name: milvus
    static_configs:
      - targets: ["host.docker.internal:9091"]
